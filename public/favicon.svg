<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Guides">
  <!-- Book cover -->
  <rect x="14" y="6" width="38" height="52" rx="5" ry="5" fill="#7ec8eb" stroke="#111" stroke-width="3"/>

  <!-- Spine binding -->
  <path fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"
        d="M14 12 v40"/>
  <g stroke="#111" stroke-width="2.5" stroke-linecap="round">
    <path d="M10 16 h8"/>
    <path d="M10 24 h8"/>
    <path d="M10 32 h8"/>
    <path d="M10 40 h8"/>
    <path d="M10 48 h8"/>
  </g>

  <!-- GUIDE label -->
  <text x="33" y="18.5" text-anchor="middle" fill="#111"
        font-family="Arial Black, Arial, sans-serif" font-size="7.2" font-weight="800"
        letter-spacing="0.4">GUIDE</text>

  <!-- Yellow badge -->
  <rect x="21" y="22" width="24" height="24" rx="2.5" ry="2.5" fill="#f2c01e" stroke="#111" stroke-width="2.6"/>

  <!-- Flag pole -->
  <rect x="26.2" y="26.5" width="3.2" height="15" rx="1.4" fill="#fff" stroke="#111" stroke-width="1.8"/>

  <!-- Flag -->
  <path fill="#ff5a4a" stroke="#111" stroke-width="1.8" stroke-linejoin="round"
        d="M29.2 27.4 H40.2 L37.4 31.2 L40.2 35 H29.2 Z"/>
  <path fill="#fff" opacity="0.85" d="M30.4 28.4 h2.2 v1.1 h-2.2 z"/>
  <path fill="#fff" opacity="0.85" d="M30.4 30.8 h1.5 v0.9 h-1.5 z"/>

  <!-- Bottom dash -->
  <path fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" d="M28 52.5 h12"/>

  <!-- Cover edge ticks -->
  <g stroke="#111" stroke-width="2" stroke-linecap="round">
    <path d="M24 6.2 v2.2"/>
    <path d="M33 6.2 v2.2"/>
    <path d="M42 6.2 v2.2"/>
    <path d="M51.5 18 h-2.2"/>
    <path d="M51.5 32 h-2.2"/>
    <path d="M51.5 46 h-2.2"/>
    <path d="M24 57.8 v-2.2"/>
    <path d="M33 57.8 v-2.2"/>
    <path d="M42 57.8 v-2.2"/>
  </g>
</svg>
